syntax = "proto3";

package aerolock.common;

message Flight {
  string id = 1;
  string origin = 2;
  string destination = 3;
  string departure_time = 4;
  string arrival_time = 5;
  double price = 6;
}

message Seat {
  string id = 1;
  string flight_id = 2;
  string seat_number = 3;
  string status = 4;
}

message ErrorResponse {
  int32 code = 1;
  string message = 2;
}