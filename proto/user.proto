syntax = "proto3";

package aerolock.user;

import "common.proto";

service UserService {
  rpc RegisterUser (RegisterRequest) returns (AuthResponse);
  rpc LoginUser (LoginRequest) returns (AuthResponse);
  rpc GetProfile (GetProfileRequest) returns (UserProfileResponse);
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string first_name = 3;
  string last_name = 4;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message AuthResponse {
  bool success = 1;
  string access_token = 2;
  string message = 3;
  string user_id = 4;
}

message GetProfileRequest {
  string user_id = 1;
}

message UserProfileResponse {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string role = 5;
}