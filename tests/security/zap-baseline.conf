# zap-baseline rule configuration file
# Change WARN to IGNORE to ignore rule or FAIL to fail if rule matches
# Only the rule identifiers are used - the names are just for info
# You can add more rules to this file or change the rule levels

# 10011 - Cookie No HttpOnly Flag
10011	IGNORE	(Cookie No HttpOnly Flag)

# 10015 - Incomplete or No Cache-control Header
10015	IGNORE	(Incomplete or No Cache-control Header)

# 10020 - Anti-CSRF Tokens Check
10020	IGNORE	(Anti-CSRF Tokens Check)

# 10021 - X-Content-Type-Options Header Missing
10021	WARN	(X-Content-Type-Options Header Missing)

# 10023 - Information Disclosure - Debug Error Messages
10023	FAIL	(Information Disclosure - Debug Error Messages)

# 10038 - Content Security Policy (CSP) Header Not Set
10038	WARN	(Content Security Policy (CSP) Header Not Set)
