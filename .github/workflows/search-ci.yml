name: Search Service CI

on:
  push:
    paths:
      - 'search-service/**'
      - 'shared/**'
  pull_request:
    paths:
      - 'search-service/**'
      - 'shared/**'

jobs:
  test-search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install Shared Dependencies
        run: |
          cd shared
          poetry install --no-root

      - name: Install Search Dependencies
        run: |
          cd search-service
          poetry install --no-root

      - name: Run Search Unit Tests
        run: |
          cd search-service
          poetry run pytest
