name: Unit Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Install Shared Package Dependencies
      run: |
        cd shared
        poetry install

    - name: Run Gateway Unit Tests
      run: |
        cd gateway
        poetry install --no-root
        poetry run pytest

    - name: Run Inventory Service Unit Tests
      run: |
        cd inventory-service
        poetry install
        poetry run pytest

    - name: Run Search Service Unit Tests
      run: |
        cd search-service
        poetry install
        poetry run pytest
