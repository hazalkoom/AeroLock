[tool.poetry]
name = "aerolock-user-service"
version = "0.1.0"
description = "AeroLock User and Authentication gRPC Microservice"
authors = ["Mohamed Ahmed <mwhamd345@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.12"
grpcio = "^1.60.0"
grpcio-tools = "^1.60.0"
sqlalchemy = "^2.0.25"
asyncpg = "^0.29.0"
pydantic = "^2.6.1"
pydantic-settings = "^2.1.0"
# Cryptography and Auth tools
cryptography = "^42.0.2"
pyjwt = {extras = ["crypto"], version = "^2.8.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"