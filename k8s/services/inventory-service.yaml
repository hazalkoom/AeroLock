apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  labels:
    app: inventory-service
spec:
  ports:
    - port: 50052
      name: grpc
  selector:
    app: inventory-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  labels:
    app: inventory-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: hazalkoom/aerolock-inventory-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50052
          envFrom:
            - configMapRef:
                name: aerolock-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aerolock-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: aerolock-secrets
                  key: REDIS_URL
