version: '3'

services:
  gateway:
    volumes:
      - ./gateway:/app/gateway
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers --forwarded-allow-ips "*"

  inventory-service:
    volumes:
      - ./inventory-service:/app/inventory-service
    command: python -m app.main --reload

  search-service:
    volumes:
      - ./search-service:/app/search-service
    command: python -m app.main --reload