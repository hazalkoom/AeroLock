services:
  gateway:
    # Mount the local gateway and shared code so changes reflect immediately without rebuilding the image
    volumes:
      - ./gateway:/app/gateway
      - ./shared:/app/shared
    # Use uvicorn's native reload flag for hot-reloading
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--proxy-headers", "--forwarded-allow-ips=*"]

  inventory-service:
    # Mount the local inventory and shared code
    # (Note: Python doesn't hot-reload by default, but this lets you apply changes with just `docker restart aerolock-inventory-service` instead of a full image rebuild!)
    volumes:
      - ./inventory-service:/app/inventory-service
      - ./shared:/app/shared

  
  user-service:
    volumes:
      - ./user-service:/app/user-service
      - ./shared:/app/shared

  search-service:
    # Mount the local search and shared code
    volumes:
      - ./search-service:/app/search-service
      - ./shared:/app/shared