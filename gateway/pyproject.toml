[project]
name = "gateway-service"
version = "0.1.0"
description = ""
authors = [
    {name = "Mohamed Ahmed",email = "mwhamd345@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn[standard] (>=0.49.0,<0.50.0)",
    "grpcio (>=1.82.1,<2.0.0)",
    "grpcio-tools (>=1.82.1,<2.0.0)",
    "aerolock-common @ ../shared",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "slowapi (>=0.1.10,<0.2.0)",
    "redis (>=8.0.1,<9.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
